name: CI

on:
  push:
  pull_request:

jobs:
  display:
    name: Display (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: display
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: display/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  functions:
    name: Cloud Functions (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest
